version: '3.8'

services:
  g7-servicerequest-db:
    image: mysql:8.0
    container_name: g7-servicerequest-db
    environment:
      MYSQL_ROOT_PASSWORD: devpassword
      MYSQL_DATABASE: service_request_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdevpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - servicerequest_db_data:/var/lib/mysql

  service-request-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-request-service
    ports:
      - "8081:8081"
    depends_on:
      g7-servicerequest-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://g7-servicerequest-db:3306/service_request_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: devpassword
      JWT_SECRET: sprint1-placeholder-dev-secret-key-change-me-before-anything-real-CHANGE
      # Group 5 Identity Service (local default):
      IDENTITY_SERVICE_BASE_URL: http://localhost:8001
      # Group 6 Facility Service:
      # Group 6 isn't part of this compose file yet, but we already know their real Docker network
      # hostname is facility-resource-service:8081 (their own network, distinct from ours).
      # Once Group 6 joins the shared network, override GROUP6_FACILITY_SERVICE_BASE_URL here:
      # GROUP6_FACILITY_SERVICE_BASE_URL: http://facility-resource-service:8081

volumes:
  servicerequest_db_data:
