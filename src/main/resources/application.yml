spring:
  application:
    name: service-request-service
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs


usm:
  jwt:
    secret: ${JWT_SECRET:"sprint1-placeholder-dev-secret-key-change-me-before-anything-real-CHANGE"}
    issuer: ${JWT_ISSUER:"usm-g7-dev"}
    expiration-minutes: 60
  internal:
    service-role-department: "SYSTEM"

group6:
  facility-service:
    base-url: ${GROUP6_FACILITY_SERVICE_BASE_URL:http://localhost:9091}
    enforce-validation: ${GROUP6_FACILITY_ENFORCE_VALIDATION:false}

services:
  identity:
    base-url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8001}
    jwks-uri: ${services.identity.base-url}/.well-known/jwks.json
    issuer: university-identity-service
    audience: university-services-platform

logging:
  level:
    com.usm.servicerequest: INFO
