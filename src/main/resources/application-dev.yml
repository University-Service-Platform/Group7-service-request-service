# Local dev profile - matches the two-container setup in the guide (§14 Phase 0, step E).
# docker run --name g7-servicerequest-db -e MYSQL_ROOT_PASSWORD=devpassword \
#   -e MYSQL_DATABASE=service_request_db -p 3306:3306 -d mysql:8.0
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3308/service_request_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:devpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

# Dev-only endpoint (security.DevTokenController) that mints placeholder JWTs so
# you can hit protected endpoints locally before Group 5's real login exists.
# NEVER enable this profile outside your own machine.
usm:
  dev-tools:
    enabled: true
